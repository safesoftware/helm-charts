{{ if gt (int .Values.deployment.numCores) 1}}
apiVersion: {{ include "fmeflow.pdb.apiversion" . }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "fmeflow.workloadName" (dict "ctx" . "name" "core-pdb") }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      safe.k8s.fmeflow.component: core
{{ end }}
